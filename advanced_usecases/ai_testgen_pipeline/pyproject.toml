[project]
name = "ai-testgen-pipeline"
version = "0.1.0"
description = "Durable AI coding workflow demo for generating and verifying unit tests."
requires-python = ">=3.12"
dependencies = [
  "dbos>=0.9.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "pytest>=8.3.0",
  "sqlalchemy>=2.0.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-mock>=3.14.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
