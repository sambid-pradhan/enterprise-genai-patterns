services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: dbos
      POSTGRES_PASSWORD: dbos
      POSTGRES_DB: testgen
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbos -d testgen"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./repos:/workspace/repos
      - ./prompts:/workspace/prompts
      - ./sample_target_repo:/workspace/sample_target_repo
      - ./.codex:/workspace/.codex
